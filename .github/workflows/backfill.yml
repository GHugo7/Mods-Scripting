name: backfill releases

# Publie une release pour les builds 1 à 5, faits avant l'ajout des releases automatiques.
on:
  push:
    paths:
      - .github/workflows/backfill.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and release 1.0.1 to 1.0.5
        run: |
          set -euo pipefail
          release() {
            n="$1"; sha="$2"; title="$3"
            if gh release view "build-$n" >/dev/null 2>&1; then
              echo "build-$n existe déjà"; return
            fi
            git checkout -q --force "$sha"
            rm -rf build/libs
            ./gradlew build --no-daemon -Pversion="1.0.$n"
            gh release create "build-$n" build/libs/*.jar \
              --target "${{ github.sha }}" \
              --title "Auto Farm 1.0.$n" \
              --latest=false \
              --notes "$title

          Build du commit $sha.

          Installation : Fabric Loader + Fabric API pour Minecraft 1.21.11, puis mettre le .jar dans \`mods/\`."
          }
          release 1 de251be659a9aed678817305083a80f0d17577b0 "Première version (gauche/droite + casse des cultures)"
          release 2 58ad8b5176530ada75dbfd0b11d72e2dcdfbb7b6 "Build sur JDK 25"
          release 3 d003c5d80b978ecd3a2a04269baf536a298f7fa6 "Continue quand un menu (Échap) est ouvert"
          release 4 cc25bce67dcb6ca02d28fec6973dd9bf2837ad88 "Arrêt quand le captcha apparaît dans le chat"
          release 5 99bd52417b7c521d7971162ad8ee785aa248f5ca "Alarme forte, notification PC et bouton Tester"
