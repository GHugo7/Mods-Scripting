name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon -Pversion=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: autofarm-mod
          path: build/libs/*.jar
      # Chaque build réussi (hors pull request) est publié en release avec le .jar.
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: build-${{ github.run_number }}
          name: Auto Farm 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Build automatique du commit ${{ github.sha }} (branche `${{ github.ref_name }}`).

            ${{ github.event.head_commit.message }}

            Installation : Fabric Loader + Fabric API pour Minecraft 1.21.11, puis mettre le .jar dans `mods/`.
          files: build/libs/*.jar
          make_latest: true
