name: api-dump

# Temporaire : affiche les signatures des classes Minecraft 26.2 / Fabric API utilisées par le mod.
on:
  push:
    paths:
      - .github/workflows/api-dump.yml
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew -p versions/26.2 compileJava --no-daemon || true
      - name: Dump API
        run: |
          set +e
          MC=$HOME/.gradle/caches/fabric-loom/26.2/minecraft-client.jar
          echo "MC JAR: $MC"; ls -la "$MC"
          for c in net.minecraft.client.gui.Hud net.minecraft.client.gui.components.ChatComponent net.minecraft.client.gui.screens.Screen \
                   'net.minecraft.client.KeyMapping$Category' net.minecraft.client.gui.components.AbstractSliderButton \
                   net.minecraft.client.gui.components.events.AbstractContainerEventHandler net.minecraft.client.gui.components.events.ContainerEventHandler \
                   net.minecraft.client.gui.components.Tooltip 'net.minecraft.client.gui.components.Button$Builder' \
                   net.minecraft.client.multiplayer.chat.ChatListener net.minecraft.client.multiplayer.ClientPacketListener \
                   net.minecraft.client.resources.sounds.SimpleSoundInstance net.minecraft.client.User; do
            echo "=================== $c"
            javap -protected -cp "$MC" "$c" 2>&1 | grep -v "lambda\$" | head -200
          done
          echo "=================== Options hide"
          javap -public -cp "$MC" net.minecraft.client.Options | grep -i -E "hide|gui"
          echo "=================== Minecraft screen/hud/chat"
          javap -public -cp "$MC" net.minecraft.client.Minecraft | grep -i -E "screen|hud|chat|gui"
          FAB=$(find ~/.gradle -name "fabric-*.jar" 2>/dev/null | grep -v sources)
          for j in $FAB; do
            for cls in $(unzip -l "$j" | awk '{print $4}' | grep -E "ClientReceiveMessageEvents.*\.class$" | sed 's/\.class$//; s#/#.#g'); do
              echo "=================== $cls"; javap -public -cp "$j:$MC" "$cls" 2>&1 | head -30
            done
          done
