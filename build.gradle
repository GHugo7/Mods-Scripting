plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

// Code commun (src/main/java) + implémentation 1.21.11 des appels qui changent selon la version.
sourceSets {
	main {
		java.srcDir 'src/mc1_21_11/java'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Version du jar : 1.0.N+1.21.11 (la version 26.2 est construite par versions/26.2).
version = "${project.version}+${project.minecraft_version}"

processResources {
	def props = [version: project.version, minecraft_dep: "~${project.minecraft_version}", java_dep: ">=21"]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
